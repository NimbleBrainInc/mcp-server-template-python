name: Build MCPB Bundle

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Update manifest version from tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          # The Server Card reports __version__, which only `make bump` moves.
          PKG_VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/mcp_example/__init__.py)
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version $VERSION differs from __version__ $PKG_VERSION; run make bump before tagging."
            exit 1
          fi
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp.json
          mv manifest.tmp.json manifest.json
          if [ -f server.json ]; then
            jq --arg v "$VERSION" '.version = $v' server.json > server.tmp.json
            mv server.tmp.json server.json
          fi

      - uses: NimbleBrainInc/mcpb-pack@v2
        with:
          output: "{name}-{version}-${{ matrix.os }}-${{ matrix.arch }}.mcpb"
